/**:
  ros__parameters:
    icc_parameters:
      enable: true
      detection_range: 50.0 # [m]
      ttc_threshold: 1.0 # [s]
      ego_deceleration: 1.0 # [m/s^2]
      min_time_horizon: 10.0 # [s]
      on_time_buffer: 0.5 # [s]
      off_time_buffer: 1.0 # [s]
      close_distance_th: 3.0 # [m]
      close_time_th: 3.0 # [s]

      right_turn:
        enable: true
        check_traffic_signal: true
        check_crossing_lanes: true
        check_turning_lanes: true
        crossing_lane_angle_th: 0.785398 # [rad] (45 deg)

      left_turn:
        enable: true
        check_traffic_signal: true
        check_turning_lanes: true

      # Obstacle-grid consumer settings (the data source is now the 2.5D obstacle grid, not a raw
      # point cloud; the group key is kept as `pointcloud` to minimize downstream churn).
      pointcloud:
        height_buffer: 0.5  # [m]
        min_height: 0.5  # [m]
        min_point_count_cell: 1  # [-] per-cell raw (pre-voxel) return floor; NOT the old post-voxel cluster min_size=10
        grid_timeout_sec: 0.5  # [s] a grid older than this reads as unavailable, never as clear
        velocity_estimation:
          max_acceleration: 20.0  # [m/s^2]
          max_velocity: 25.0  # [m/s]
          observation_time: 0.3  # [s]
          max_history_time: 0.5  # [s]
          buffer_size: 10
        latency: 0.3

      filter:
        min_velocity: 1.0  # [m/s]
        moving_time: 0.5  # [s]
