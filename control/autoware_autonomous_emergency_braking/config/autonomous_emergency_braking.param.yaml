/**:
  ros__parameters:
    # Ego path calculation
    use_predicted_trajectory: true
    use_imu_path: true
    limit_imu_path_lat_dev: false
    limit_imu_path_length: true
    use_pointcloud_data: true
    use_predicted_object_data: false
    use_object_velocity_calculation: true
    check_autoware_state: true
    imu_path_lat_dev_threshold: 1.75
    min_generated_imu_path_length: 0.5
    max_generated_imu_path_length: 10.0
    imu_prediction_time_horizon: 1.5
    imu_prediction_time_interval: 0.1
    mpc_prediction_time_horizon: 4.5
    mpc_prediction_time_interval: 0.1

    # Debug
    publish_debug_markers: true

    # Obstacle grid z-band
    detection_range_max_height_margin: 0.0

    # Ego path cropping
    expand_width: -0.2
    speed_calculation_expansion_margin: 0.7

    # Obstacle grid gating (replaces voxel + Euclidean clustering; per-cell gate + 8-connected
    # component point-sum). minimum_cluster_size counts RAW returns (the grid is pre-voxel), so a
    # value tuned for the old post-voxel cluster size may need to be raised accordingly.
    cluster_minimum_height: 0.1  # per-cell low_max_height floor [m] (tallest in-band return)
    minimum_cluster_size: 10     # min summed point_count over an 8-connected component of cells
    min_point_count_cell: 1      # per-cell density floor [returns]
    obstacle_grid_timeout_sec: 0.5  # grid staleness watchdog [s]; stale = unavailable, not "clear"

    # RSS distance collision check
    longitudinal_offset_margin: 1.0
    t_response: 1.0
    a_ego_min: -3.0
    a_obj_min: -1.0
    collision_keeping_sec: 3.0
    previous_obstacle_keep_time: 1.0
    aeb_hz: 10.0
